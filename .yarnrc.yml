approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmPreapprovedPackages:
  - vitest
  - "@vitest/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0

packageExtensions:
  "@vitejs/plugin-react@*":
    peerDependencies:
      vite: "*"
  "@storybook/react-vite@*":
    peerDependencies:
      vite: "*"
  "vitest@*":
    peerDependencies:
      vite: "*"
  "oxc-config-mantine@*":
    peerDependenciesMeta:
      oxfmt:
        optional: true
      oxlint:
        optional: true

logFilters:
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0086
    level: discard
